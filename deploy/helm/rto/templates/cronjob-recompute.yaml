{{- if .Values.recomputeCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rto.fullname" . }}-recompute
  labels: {{- include "rto.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.recomputeCronJob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: {{- include "rto.selector" . | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: recompute
              image: {{ include "rto.image" . }}
              command: ["rto", "recompute"]
              {{- include "rto.env" . | nindent 14 }}
              securityContext: {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts: [{name: tmp, mountPath: /tmp}]
          volumes: [{name: tmp, emptyDir: {}}]
{{- end }}
