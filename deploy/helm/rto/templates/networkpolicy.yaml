{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rto.fullname" . }}
  labels: {{- include "rto.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "rto.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}}
      ports: [{port: 8000}]
  egress:
    - to: [{ipBlock: {cidr: {{ .Values.networkPolicy.databaseCidr }}}}]
      ports: [{port: 5432}]
    - ports: [{port: 443}]       # Entra ID (login.microsoftonline.com), Microsoft Graph
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- end }}
