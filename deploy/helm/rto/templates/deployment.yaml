apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rto.fullname" . }}
  labels: {{- include "rto.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {{- include "rto.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rto.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "rto.selector" . | nindent 14 }}
      terminationGracePeriodSeconds: 40
      containers:
        - name: app
          image: {{ include "rto.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "rto.env" . | nindent 10 }}
          env:
            - {name: WEB_CONCURRENCY, value: {{ .Values.webConcurrency | quote }}}
            - {name: TMPDIR, value: /tmp}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 20
          lifecycle:
            preStop: {exec: {command: ["sleep", "5"]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
