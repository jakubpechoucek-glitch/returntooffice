{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rto.fullname" . }}
  labels: {{- include "rto.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "rto.selector" . | nindent 6 }}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
{{- end }}
