# Local development / demo stack:  docker compose up --build
#   http://localhost:8000  (dev sign-in page; pick any persona)
# Not for production: see deploy/helm and docs/deployment.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rto
      POSTGRES_USER: rto
      POSTGRES_PASSWORD: rto
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rto -d rto"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["sh", "-c", "rto migrate && rto seed-demo || true"]
    environment: &env
      RTO_ENVIRONMENT: development
      RTO_AUTH_MODE: dev
      RTO_DATABASE_URL: postgresql+psycopg://rto:rto@db:5432/rto
      RTO_SECRET_KEY: local-dev-secret-key-change-me
    depends_on:
      db: {condition: service_healthy}

  app:
    build: .
    environment:
      <<: *env
      WEB_CONCURRENCY: "2"
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
