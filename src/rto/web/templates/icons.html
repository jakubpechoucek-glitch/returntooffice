{#- Inline SVG icon set (no external assets; CSP-safe). Stroke icons on a 24x24 grid. -#}
{% macro icon(name, size=18, cls='') -%}
<svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'home' -%}
  <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/>
{%- elif name == 'inbox' -%}
  <rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 13.5h5l1.5 2.5h4l1.5-2.5h5"/>
{%- elif name == 'users' -%}
  <circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.4-3.3 2.9-5.3 6-5.3s5.6 2 6 5.3"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16.4 14.4c2.6.2 4.3 2 4.6 4.8"/>
{%- elif name == 'tree' -%}
  <rect x="9" y="3" width="6" height="4.5" rx="1"/><rect x="2.5" y="16.5" width="6" height="4.5" rx="1"/><rect x="15.5" y="16.5" width="6" height="4.5" rx="1"/><path d="M12 7.5V12M5.5 16.5V12h13v4.5"/>
{%- elif name == 'chart' -%}
  <path d="M3 20.5h18"/><rect x="5" y="11" width="3" height="7" rx=".6"/><rect x="10.5" y="6" width="3" height="12" rx=".6"/><rect x="16" y="13" width="3" height="5" rx=".6"/>
{%- elif name == 'settings' -%}
  <path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/>
{%- elif name == 'help' -%}
  <circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"/><path d="M12 16.8v.2"/>
{%- elif name == 'calendar' -%}
  <rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
{%- elif name == 'upload' -%}
  <path d="M12 15.5V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v4.5h16V15"/>
{%- elif name == 'download' -%}
  <path d="M12 4v11.5M7.5 11 12 15.5 16.5 11"/><path d="M4 15v4.5h16V15"/>
{%- elif name == 'shield' -%}
  <path d="M12 3.2 19.5 6v5.6c0 4.6-3.1 7.7-7.5 9.2-4.4-1.5-7.5-4.6-7.5-9.2V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>
{%- elif name == 'target' -%}
  <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.3"/>
{%- elif name == 'building' -%}
  <rect x="4.5" y="3.5" width="15" height="17" rx="1.5"/><path d="M8.5 7.5h2M13.5 7.5h2M8.5 11.5h2M13.5 11.5h2M10.5 20.5v-4h3v4"/>
{%- elif name == 'log' -%}
  <rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4.5"/>
{%- elif name == 'person' -%}
  <circle cx="12" cy="8" r="3.6"/><path d="M5 20c.6-3.8 3.4-6 7-6s6.4 2.2 7 6"/>
{%- elif name == 'months' -%}
  <rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>
{%- elif name == 'plus' -%}
  <path d="M12 5v14M5 12h14"/>
{%- elif name == 'flag' -%}
  <path d="M5 21V4"/><path d="M5 4.5h11l-2 4 2 4H5"/>
{%- elif name == 'check' -%}
  <path d="m5 12.5 4.5 4.5L19 7.5"/>
{%- elif name == 'x' -%}
  <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'alert' -%}
  <path d="M12 4 21 19.5H3z"/><path d="M12 10v4.5M12 17v.2"/>
{%- elif name == 'logout' -%}
  <path d="M14.5 4.5H19v15h-4.5"/><path d="m9.5 8-4 4 4 4M5.5 12h10"/>
{%- elif name == 'menu' -%}
  <path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == 'arrow' -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
{%- endif -%}
</svg>
{%- endmacro %}
