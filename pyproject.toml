[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rto-compliance"
version = "0.1.0"
description = "Work Onsite (WOS) compliance tracker: onsite tagging, weekly/monthly/annual adherence, exemptions, disputes and hierarchical reporting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "uvicorn-worker>=0.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "authlib>=1.3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "openpyxl>=3.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "locust>=2.29"]

[project.scripts]
rto = "rto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rto = ["web/templates/**/*.html", "web/static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "E501", "UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"migrations/*" = ["E", "W", "I"]
