name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RTO_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Migrations apply cleanly
        env:
          RTO_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rto_test
        run: |
          rto migrate
          alembic check   # fails if models and migrations drift apart
      - run: pytest -p no:warnings

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rto:${{ github.sha }}
          load: true
      - name: Image runs and answers health checks
        run: |
          docker run -d --name rto -p 8000:8000 -e RTO_ENVIRONMENT=development -e RTO_AUTH_MODE=dev \
            -e RTO_DATABASE_URL=sqlite+pysqlite:////tmp/rto.db rto:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs localhost:8000/healthz
          docker logs rto | tail -20
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rto:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # report only in the prototype; set to "1" when hardening

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/rto
      - run: helm template ci deploy/helm/rto > /dev/null
